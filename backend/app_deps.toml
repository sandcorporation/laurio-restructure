[contests]
group = "contest"
uses = ["accounts", "core", "ledger", "notifications", "policies", "storage", "submissions", "verification"]
plugs = ["accounts", "core", "submissions"]
reads = ["appeals", "awards", "distributions", "handovers", "scoring"]

